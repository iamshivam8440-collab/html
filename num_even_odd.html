<!doctype html>
<html>
	<head>
		<title>Logic</title>
		<script language="javascript">
			var a;
			a=prompt("Enter a number:");
			if(a%2==0)
			{
				document.write("Number is even:");
			}
			else
			{
				document.write("Number is odd:");
			}
		</script>
	</head>
	<body>
		   <hr>
	       <h1>Hello World!!</h1>
		   <hr>
	</body>
</html>
