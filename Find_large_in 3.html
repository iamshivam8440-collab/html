<html>
	<head>
		<title>Logic</title>
		<script language="javascript">
			var a,b,c;
			a=prompt("Enter first number:");
			b=prompt("Enter second number:");
			c=prompt("Enter third number:");
			if(a>b&&a>c)
			{
				document.write("a is large:");
			}
			else if(b>a&&b>c)
			{
				document.write("b is large:");
			}
			else if(c>b&&c>a)
			{
				document.write("c is large:");
			}
			else
			{
				document.write("a,b,c are equal:");
			}
		</script>
	</head>
