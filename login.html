<!doctype html>
<html>
	<head>
		<title>Login Form</title>
	</head>
	<body>
		<form>
			<table border="1" width="30%" style="background-color:#980e1f;color:white;margin-left:400px;margin-top:100px">
				<tr align="center">
					<td colspan="2">Login Form</td>
				</tr>
				<tr>
					<td>User Name</td>
					<td><input type="text" placeholder="Enter User Name" size="40"/></td>
				</tr>
				<tr>
					<td>Password</td>
					<td><input type="Password" placeholder="Enter Password" size="40"/></td>
				</tr>
				<tr align="center">
					<td colspan="2"><input type="submit" value="Submit"/></td>
				</tr>
			</table>
		</form>
	</body>
</html>
