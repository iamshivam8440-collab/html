<!doctype html>
<html>
	<head>
		<title>Logic</title>
		<script language="javascript">
			var a,b,c,num;
			num=parseInt(prompt("Enter the number:"));
			switch(num)
			{
				case 1:a=prompt("Enter first number:");
					   b=prompt("Enter second number:");
					   c=parseInt(a)+parseInt(b);
					   document.write("Sum is="+c);
					   document.write("<br>");
					   break;
				case 2:a=prompt("Enter first number:");
					   b=prompt("Enter second number:");
					   c=parseInt(a)-parseInt(b);
					   document.write("Sub is="+c);
					   document.write("<br>");					   
					   break;
				case 3:a=prompt("Enter first number:");
					   b=prompt("Enter second number:");
					   c=parseInt(a)*parseInt(b);
					   document.write("Mul is="+c);
					   document.write("<br>");
					   break;
				case 4:a=prompt("Enter first number:");
					   b=prompt("Enter second number:");
					   c=parseInt(a)/parseInt(b);
					   document.write("Div is="+c);	
					   document.write("<br>");
					   break;					   
				default:document.write("Invalid input");	   
			}
		</script>
	</head>
	<body>
		   <hr>
	       <h1>Hello World!!</h1>
		   <hr>
	</body>
</html>
