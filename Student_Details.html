<!doctype html>
<html>
	<head>
		<title>Student Details</title>
	</head>
	<body>
		<form>
			<table border="1" width="30%" style="background-color:#a182d6;cellpadding:8;cellspacing:8;color:white;margin-left:400px;margin-top:100px">
				<tr align="center">
					<td colspan="2"style="color:#81fffe"><h2>Student Details</h2></td>
				</tr>
				<tr>
					<td>Student Name</td>
					<td><input type="text" required placeholder="Student Name"/></td>
				</tr>
				<tr>
					<td>Student ID</td>
					<td><input type="text" required placeholder="Student ID" minlength="8" maxlength="8" title="Use only number"/></td>
				</tr>
				<tr>
					<td>Student Mob.</td>
					<td><input type="text" required placeholder="Student Mob." minlength="10" maxlength="10"/></td>
				</tr>
				<tr>
					<td>Father Name</td>
					<td><input type="text" required placeholder="Father Name"/></td>
				</tr>
				<tr>
					<td>Father Mob.</td>
					<td><input type="text" required placeholder="Father Mob."minlength="10" maxlength="10"/></td>
				</tr>
				<tr>
					<td>Mother Name</td>
					<td><input type="text" required placeholder="Mother Name"/></td>
				</tr>
				<tr>
					<td>Mother Mob.</td>
					<td><input type="text" required placeholder="Mother Mob." minlength="10" maxlength="10"/></td>
				</tr>
				<tr align="center">
					<td colspan="2"><input type="submit" value="Submit"/></td>
				</tr>
			</table>
		</form>
	</body>
</html>
